<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieMaze HTML</title>
    <link rel="icon" href="favicon.ico" />
  </head>
 <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>MovieMaze<sup>&reg;</sup></h1>

      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">Play</a></li>
          <li><a href="scores.html">Leaderboard</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <div class="players">
        Player:
        <span class="player-name">Movie guy</span>
      </div>
      <div>
        <label for="count">Score</label>
        <input type="text" id="count" value="--" readonly />
      </div>

      <br />

      <br />

      </div>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Nathan Gehring</span>

      <a href="https://github.com/ngehring16/startup">GitHub</a>

</html>
